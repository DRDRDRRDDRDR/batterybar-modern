[package]
name = "batterybar-modern"
version = "0.1.0"
edition = "2021"
description = "Modern open-source BatteryBar: embedded taskbar battery bar + tray icon + detail popup (Windows 10/11)"
license = "MIT"

[[bin]]
name = "batterybar-modern"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    # WinRT: battery
    "Devices_Power",
    "Foundation",
    "System_Power",
    # Win32 core
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
